<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nabız Haber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  :root {
    --bg: #ece9e3; --panel: #fff; --ink: #1a1b22; --muted: #6b6c78; --line: #e3e0d8;
    --accent: #b22222; --accent-soft: #fbeceb; --chip: #f3f1ec;
    --yerel: #1f6f5c; --genel: #2d5fa8; --radius: 14px;
    --fh: "Space Grotesk", system-ui, sans-serif; --fb: "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f12; --panel: #1b1c22; --ink: #f0eee9; --muted: #9a9ba6; --line: #2b2c34;
      --accent: #ff6b5e; --accent-soft: #3a1f1d; --chip: #26272f;
      --yerel: #4cc4a6; --genel: #7aa6e8; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--fb); line-height: 1.5; }
  a { color: inherit; text-decoration: none; }

  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; padding: 12px 20px;
  }
  .logo { font-family: var(--fh); font-weight: 700; font-size: 1.2rem; }
  .logo b { color: var(--accent); }
  .logo small { color: var(--muted); font-weight: 500; font-size: 0.68rem; display: block; letter-spacing: .02em; }
  #search {
    flex: 0 1 300px; max-width: 320px; background: var(--chip); border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 16px; color: var(--ink); font: inherit; font-size: 0.86rem;
  }
  #search::placeholder { color: var(--muted); }
  #refresh {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font: inherit; font-weight: 600; font-size: 0.82rem; padding: 8px 14px; border-radius: 999px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  #refresh:hover { border-color: var(--accent); color: var(--accent); }
  #refresh[disabled] { opacity: .6; cursor: default; }
  #refresh .ic { display: inline-block; font-size: 1rem; line-height: 1; }
  #refresh.spin .ic { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fresh { margin-left: auto; color: var(--muted); font-size: 0.72rem; white-space: nowrap; }

  /* Canlı piyasa bandı (ticker) */
  .ticker { flex: 1 1 auto; min-width: 0; overflow: hidden; height: 26px; display: flex; align-items: center; margin: 0 6px;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 18px, #000 calc(100% - 18px), transparent);
    mask-image: linear-gradient(90deg, transparent, #000 18px, #000 calc(100% - 18px), transparent); }
  .ticker-track { display: inline-flex; gap: 22px; white-space: nowrap; will-change: transform; animation: tick 45s linear infinite; }
  .ticker:hover .ticker-track { animation-play-state: paused; }
  @keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .tk { display: inline-flex; align-items: baseline; gap: 6px; font-size: .8rem; color: var(--muted); }
  .tk b { color: var(--ink); font-weight: 700; }
  .tk .v { color: var(--ink); font-variant-numeric: tabular-nums; }
  .tk .up { color: var(--yerel); font-weight: 700; }
  .tk .down { color: var(--accent); font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; } }
  @media (max-width: 760px) { .ticker { display: none; } }

  .wrap { display: flex; align-items: flex-start; } /* sola yapışık, tam genişlik */

  aside {
    position: sticky; top: 61px; align-self: flex-start; width: 236px; flex: 0 0 236px;
    padding: 18px 12px; max-height: calc(100vh - 61px); overflow-y: auto;
  }
  .grp { font-size: 0.64rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; padding: 14px 10px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; border: 0; background: transparent;
    font: inherit; font-size: 0.86rem; font-weight: 600; color: var(--ink); padding: 8px 10px; border-radius: 9px; cursor: pointer;
  }
  .nav-item .scope { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .nav-item.sc-yerel .scope { background: var(--yerel); }
  .nav-item.sc-genel .scope { background: var(--genel); }
  .nav-item .n { margin-left: auto; font-size: 0.7rem; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
  .nav-item[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .nav-item[aria-pressed="true"] .n { color: var(--accent); }

  main { flex: 1; min-width: 0; padding: 20px; }
  .feed-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 16px; flex-wrap: wrap; }
  .feed-head h1 { font-family: var(--fh); font-size: 1.4rem; margin: 0; letter-spacing: -0.02em; }
  .feed-head .count { color: var(--muted); font-size: 0.8rem; }

  .chips { display: none; gap: 8px; overflow-x: auto; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    font: inherit; font-size: 0.78rem; font-weight: 600; padding: 7px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip .scope { width: 7px; height: 7px; border-radius: 50%; }
  .chip.sc-yerel .scope { background: var(--yerel); }
  .chip.sc-genel .scope { background: var(--genel); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
    display: flex; flex-direction: column; transition: border-color .15s;
  }
  .card:hover { border-color: var(--accent); }
  .card .thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: var(--chip); }
  .card .body { padding: 15px; display: flex; flex-direction: column; gap: 9px; }
  .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.72rem; }
  .src { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; }
  .src .av { width: 17px; height: 17px; border-radius: 4px; background: var(--chip); display: grid; place-items: center; font-size: 0.58rem; font-weight: 700; color: var(--muted); }
  .src.social .av { background: var(--ink); color: var(--panel); border-radius: 50%; font-size: 0.66rem; }
  .tag { font-size: 0.64rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; letter-spacing: .03em; }
  .tag.yerel { background: color-mix(in srgb, var(--yerel) 16%, transparent); color: var(--yerel); }
  .tag.genel { background: color-mix(in srgb, var(--genel) 16%, transparent); color: var(--genel); }
  .tag.sosyal { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .time { color: var(--muted); }
  .headline { font-family: var(--fh); font-size: 1rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
  .summary { color: var(--muted); font-size: 0.84rem; margin: 0; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  /* Son dakika pop-up (toast) */
  .toast-wrap { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 100; display: flex; flex-direction: column; gap: 10px; width: 360px; max-width: calc(100vw - 32px); pointer-events: none; }
  .toast {
    position: relative; pointer-events: auto; cursor: pointer; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: 12px; box-shadow: 0 14px 34px -10px rgba(0,0,0,.5);
    padding: 12px 14px; display: flex; gap: 11px; align-items: flex-start;
    transform: translateY(24px); opacity: 0; transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast .t-thumb { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; flex: 0 0 auto; background: var(--chip); }
  .toast .t-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .toast .t-label { font-size: .62rem; font-weight: 800; letter-spacing: .06em; color: var(--accent); text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }
  .toast .t-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .toast .t-title { font-family: var(--fh); font-size: .9rem; font-weight: 600; margin: 0; line-height: 1.28; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .toast .t-src { font-size: .66rem; color: var(--muted); font-weight: 600; }
  .toast .t-close { position: absolute; top: 6px; right: 8px; border: 0; background: transparent; color: var(--muted); font-size: 1rem; line-height: 1; cursor: pointer; padding: 2px 4px; }
  .toast .t-close:hover { color: var(--ink); }
  .toast .t-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: opacity .2s; transform: none; } }

  /* sağdaki X / Twitter paneli */
  .xpanel {
    position: sticky; top: 61px; align-self: flex-start; flex: 0 0 400px; width: 400px;
    height: calc(100vh - 61px); display: flex; flex-direction: column;
    border-left: 1px solid var(--line); background: var(--panel);
  }
  .xpanel .x-head { display: flex; align-items: center; gap: 8px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .xpanel .x-logo { font-weight: 800; font-size: 1.15rem; }
  .xpanel .x-head .x-ttl { font-family: var(--fh); font-weight: 600; font-size: .92rem; }
  .live-grid { flex: 1; overflow-y: auto; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
  .live-grp { grid-column: 1 / -1; font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; padding: 6px 2px 0; }
  .live { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .live:hover { border-color: var(--accent); }
  .live-player { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .live-player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .live-cap { display: flex; align-items: center; gap: 6px; padding: 7px 9px; }
  .live-name { font-family: var(--fh); font-weight: 600; font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live-badge { display: inline-flex; align-items: center; gap: 5px; font-size: .56rem; font-weight: 800; letter-spacing: .04em; color: #fff; background: #e0245e; padding: 2px 6px; border-radius: 5px; margin-left: auto; flex: 0 0 auto; }
  .live-badge .d { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1s infinite; }
  .live-fallback { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; background-color: #000; background-size: cover; background-position: center; color: #fff; text-decoration: none; }
  .live-fallback::before { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.45); }
  .live-fallback .pl { position: relative; font-size: 1.5rem; line-height: 1; }
  .live-fallback .fb-note { position: relative; font-size: .62rem; font-weight: 700; }

  @media (max-width: 1100px) { .xpanel { display: none; } }
  @media (max-width: 840px) {
    aside { display: none; }
    .chips { display: flex; position: sticky; top: 57px; z-index: 9; }
    header { padding: 12px 16px; }
    .logo small { display: none; }
    .fresh { display: none; }
    main { padding: 16px; }
    .feed-head h1 { font-size: 1.15rem; }
  }

  /* --- Uygulama içi okuyucu (sekmeli webview) --- */
  #reader { position: fixed; inset: 0; z-index: 2000; display: none; flex-direction: column;
            background: var(--bg); }
  #reader.open { display: flex; }
  .rd-bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px;
            background: var(--panel); border-bottom: 1px solid var(--line); }
  .rd-btn { border: 1px solid var(--line); background: var(--chip); color: var(--ink);
            width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 15px;
            display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .rd-btn:hover { border-color: var(--accent); color: var(--accent); }
  .rd-btn.wide { width: auto; padding: 0 12px; gap: 6px; font-size: 13px; font-weight: 600; }
  .rd-tabs { display: flex; gap: 4px; overflow-x: auto; flex: 1 1 auto; scrollbar-width: thin; }
  .rd-tab { display: inline-flex; align-items: center; gap: 7px; max-width: 220px; min-width: 120px;
            padding: 6px 8px 6px 11px; border-radius: 8px 8px 0 0; cursor: pointer; flex: 0 0 auto;
            background: var(--chip); border: 1px solid var(--line); border-bottom: none;
            color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .rd-tab.active { background: var(--bg); color: var(--ink); }
  .rd-tab .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; }
  .rd-tab .x { flex: 0 0 auto; width: 18px; height: 18px; border-radius: 5px; line-height: 16px;
               text-align: center; font-size: 14px; }
  .rd-tab .x:hover { background: var(--line); color: var(--accent); }
  .rd-tab .spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent);
                  border-radius: 50%; animation: rdspin .7s linear infinite; flex: 0 0 auto; display: none; }
  .rd-tab.loading .spin { display: inline-block; }
  @keyframes rdspin { to { transform: rotate(360deg); } }
  .rd-views { flex: 1 1 auto; position: relative; background: #fff; }
  .rd-views webview { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  .rd-views webview.active { display: flex; }
</style>
</head>
<body>
<header>
  <a class="logo" href="#"><span>Nabız<b>.</b></span><small>Türkiye · canlı RSS + sosyal</small></a>
  <input id="search" type="search" placeholder="Haber, konu veya kaynak ara…" autocomplete="off">
  <div class="ticker" id="ticker" aria-label="Canlı piyasa"></div>
  <button id="refresh" title="Haberleri yenile"><span class="ic">↻</span><span class="lbl">Yenile</span></button>
  <span class="fresh" id="fresh"></span>
</header>
<nav class="chips" id="chips"></nav>
<div class="wrap">
  <aside id="sidebar"></aside>
  <main>
    <div class="feed-head"><h1 id="title">Yükleniyor…</h1><span class="count" id="count"></span></div>
    <div class="grid" id="grid"></div>
  </main>
  <aside class="xpanel">
    <div class="x-head">
      <span class="x-logo">📺</span>
      <span class="x-ttl">Canlı Yayınlar</span>
    </div>
    <div class="live-grid" id="livegrid"><div class="live-grp" style="color:var(--muted);font-weight:500">Canlı yayınlar yükleniyor…</div></div>
  </aside>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<!-- Uygulama içi okuyucu: haber linkleri burada sekmeli açılır -->
<div id="reader">
  <div class="rd-bar">
    <button class="rd-btn" id="rd-back" title="Geri">‹</button>
    <button class="rd-btn" id="rd-fwd" title="İleri">›</button>
    <button class="rd-btn" id="rd-reload" title="Yenile">↻</button>
    <div class="rd-tabs" id="rd-tabs"></div>
    <button class="rd-btn wide" id="rd-ext" title="Dış tarayıcıda aç">🌐 Tarayıcı</button>
    <button class="rd-btn wide" id="rd-close" title="Okuyucuyu kapat">✕ Habere dön</button>
  </div>
  <div class="rd-views" id="rd-views"></div>
</div>

<script>
// Arayüz, static dosya yerine gerçek API'yi tüketir: /api/categories ve /api/articles
const GROUPS = [
  { name: "Gündem",  topics: ["gundem"] },
  { name: "Siyaset", topics: ["siyaset"] },
  { name: "Savaş",   topics: ["savas"] },
  { name: "Spor",    topics: ["spor"] },
  { name: "Ekonomi", topics: ["ekonomi"] },
  { name: "Borsa",   topics: ["borsa"] },
  { name: "Magazin", topics: ["magazin"] },
];
let CATS = [];
let current = "yg";
let query = "";
let searchTimer;
let lastGen = null;

// Konuya göre başlık emojisi (tek yerden değiştirilebilir)
const TOPIC_EMOJI = { gundem: "📰", siyaset: "🤡", savas: "⚔️", spor: "⚽", ekonomi: "💰", borsa: "📈", magazin: "🎬" };

const esc = (s) => (s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function initials(src) {
  return esc(src).replace(/[^A-Za-zÇĞİÖŞÜçğıöşü ]/g, "").trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
}

function badge(a) {
  if (a.type === "social") {
    const g = a.platform === "x" ? "𝕏" : a.platform === "bluesky" ? "B" : a.platform === "mastodon" ? "M" : "@";
    return `<span class="src social"><span class="av">${g}</span>${esc(a.source)}</span>`;
  }
  return `<span class="src"><span class="av">${initials(a.source)}</span>${esc(a.source)}</span>`;
}

function cardHTML(a) {
  const scopeTxt = a.scope === "yerel" ? "Yerel" : "Genel";
  const img = a.image
    ? `<img class="thumb" src="${esc(a.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`
    : "";
  return `<a class="card" href="${esc(a.url)}" target="_blank" rel="noopener">
    ${img}
    <div class="body">
      <div class="meta">
        ${badge(a)}
        <span class="tag ${a.scope}">${scopeTxt}</span>
        ${a.type === "social" ? '<span class="tag sosyal">Sosyal</span>' : ""}
        ${a.time ? `<span class="time">· ${esc(a.time)}</span>` : ""}
      </div>
      <h2 class="headline">${TOPIC_EMOJI[a.topic] || ""} ${esc(a.displayTitle || a.title)}</h2>
      ${a.summary ? `<p class="summary">${esc(a.summary)}</p>` : ""}
    </div>
  </a>`;
}

function buildNav() {
  const side = document.getElementById("sidebar");
  side.innerHTML = GROUPS.map((g) => {
    const items = CATS.filter((c) => g.topics.includes(c.topic));
    const em = TOPIC_EMOJI[g.topics[0]] || "";
    return `<div class="grp">${em} ${g.name}</div>` + items.map((c) =>
      `<button class="nav-item sc-${c.scope}" data-cat="${c.code}"><span class="scope"></span>${TOPIC_EMOJI[c.topic] || ""} ${c.label}<span class="n">${c.count}</span></button>`
    ).join("");
  }).join("");
  document.getElementById("chips").innerHTML = CATS.map((c) =>
    `<button class="chip sc-${c.scope}" data-cat="${c.code}"><span class="scope"></span>${TOPIC_EMOJI[c.topic] || ""} ${c.label}</button>`
  ).join("");
  document.querySelectorAll("[data-cat]").forEach((el) =>
    el.addEventListener("click", () => { current = el.dataset.cat; setPressed(); loadFeed(); })
  );
}

function setPressed() {
  document.querySelectorAll("[data-cat]").forEach((el) => el.setAttribute("aria-pressed", el.dataset.cat === current ? "true" : "false"));
}

async function loadFeed() {
  const cat = CATS.find((c) => c.code === current);
  document.getElementById("title").textContent = cat ? cat.label : "";
  const p = new URLSearchParams({ category: current, limit: "100" });
  if (query) p.set("q", query);
  try {
    const d = await fetch("/api/articles?" + p).then((r) => r.json());
    document.getElementById("count").textContent = `${d.total} haber${query ? " (arama)" : ""}`;
    document.getElementById("grid").innerHTML = d.articles.length
      ? d.articles.map(cardHTML).join("")
      : `<p class="empty">Bu kategoride${query ? " aramayla eşleşen" : ""} haber yok.</p>`;
  } catch {
    document.getElementById("grid").innerHTML = `<p class="empty">API'ye ulaşılamadı.</p>`;
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function boot() {
  try {
    const h = await fetch("/api/health").then((r) => r.json());
    if (h.generatedAt) {
      lastGen = h.generatedAt;
      setFresh(h);
    }
    CATS = await fetch("/api/categories").then((r) => r.json());
    buildNav();
    setPressed();
    await loadFeed();
    checkBreaking();
    loadLive();
    loadMarkets();
  } catch {
    document.getElementById("title").textContent = "API'ye ulaşılamadı";
    document.getElementById("grid").innerHTML = `<p class="empty">Sunucu çalışıyor mu? <code>npm run serve</code></p>`;
  }
}

function setFresh(h) {
  const live = h.refreshMinutes ? ` · oto ${h.refreshMinutes} dk` : "";
  document.getElementById("fresh").textContent =
    `Güncellendi: ${new Date(h.generatedAt).toLocaleString("tr-TR")} · ${h.total} haber${live}`;
}

// Sunucu arka planda tazeleyince açık sayfayı da güncelle (dakikada bir yokla).
async function poll() {
  try {
    const h = await fetch("/api/health").then((r) => r.json());
    if (h.generatedAt && h.generatedAt !== lastGen) {
      lastGen = h.generatedAt;
      setFresh(h);
      CATS = await fetch("/api/categories").then((r) => r.json());
      buildNav();
      setPressed();
      await loadFeed();
      checkBreaking();
    }
  } catch {}
}

// --- Son dakika pop-up (toast) ---
function foldTr(s) {
  return (s || "").replace(/İ/g, "i").replace(/I/g, "i").replace(/ı/g, "i")
    .replace(/Ş/g, "s").replace(/ş/g, "s").replace(/Ç/g, "c").replace(/ç/g, "c")
    .replace(/Ğ/g, "g").replace(/ğ/g, "g").replace(/Ö/g, "o").replace(/ö/g, "o")
    .replace(/Ü/g, "u").replace(/ü/g, "u").toLowerCase();
}
// Tam kelime eşleştirme (ör. "facilities" içindeki "acil" eşleşmesin)
const BREAKING_WORDS = [" son dakika ", " sondakika ", " flas ", " acil ", " breaking ", " canli yayin "];
function titleIsBreaking(title) {
  const t = " " + foldTr(title).replace(/[^a-z0-9]+/g, " ").replace(/\s+/g, " ").trim() + " ";
  return BREAKING_WORDS.some((w) => t.includes(w));
}
const breakingShown = new Set();
const breakingQueue = [];
let toastActive = false;
let breakingSeeded = false;

function isBreaking(a) {
  if (a.type === "social") return false;
  if (a.topic === "magazin") return false; // magazin son dakika olarak fırlamasın
  if (titleIsBreaking(a.title)) return true;
  if (a.publishedAt && (a.topic === "gundem" || a.topic === "siyaset")) {
    const mins = (Date.now() - new Date(a.publishedAt).getTime()) / 60000;
    if (mins >= 0 && mins <= 8) return true; // son 8 dk içindeki gündem/siyaset
  }
  return false;
}

async function checkBreaking() {
  try {
    const d = await fetch("/api/articles?limit=80").then((r) => r.json());
    const fresh = d.articles.filter((a) => {
      const k = a.url || a.title;
      return k && !breakingShown.has(k) && isBreaking(a);
    });
    if (!breakingSeeded) {
      breakingSeeded = true; // ilk yüklemede yalnızca en yenisini göster, kalanı "görüldü" say
      fresh.forEach((a, i) => { breakingShown.add(a.url || a.title); if (i === 0) breakingQueue.push(a); });
    } else {
      fresh.forEach((a) => { breakingShown.add(a.url || a.title); breakingQueue.push(a); });
    }
    if (breakingQueue.length > 4) breakingQueue.length = 4;
    pumpToast();
  } catch {}
}

function pumpToast() {
  if (toastActive || !breakingQueue.length) return;
  showToast(breakingQueue.shift());
}

function showToast(a) {
  toastActive = true;
  const thumb = a.image
    ? `<img class="t-thumb" src="${esc(a.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`
    : "";
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `${thumb}<div class="t-body"><span class="t-label"><span class="t-dot"></span>Son dakika</span><h3 class="t-title">${TOPIC_EMOJI[a.topic] || ""} ${esc(a.displayTitle || a.title)}</h3><span class="t-src">${esc(a.source)}${a.time ? " · " + esc(a.time) : ""}</span></div><button class="t-close" aria-label="Kapat">×</button><span class="t-bar"></span>`;
  document.getElementById("toasts").appendChild(el);

  requestAnimationFrame(() => el.classList.add("show"));
  const bar = el.querySelector(".t-bar");
  requestAnimationFrame(() => { bar.style.transition = "width 30s linear"; bar.style.width = "0%"; });

  let done = false;
  const timer = setTimeout(dismiss, 30000); // 30 sn sonra kaybol
  function dismiss() {
    if (done) return;
    done = true;
    clearTimeout(timer);
    el.classList.remove("show");
    setTimeout(() => { el.remove(); toastActive = false; pumpToast(); }, 400);
  }
  el.addEventListener("click", (e) => {
    if (e.target.closest(".t-close")) { e.stopPropagation(); dismiss(); return; }
    if (a.url) window.open(a.url, "_blank", "noopener"); // habere git
  });
}

// --- Sağ panel: canlı YouTube yayınları (/api/live'dan güncel video kimlikleri) ---
async function loadLive() {
  try {
    const list = await fetch("/api/live").then((r) => r.json());
    const box = (c) => {
      const inner = (c.embeddable && c.videoId)
        ? `<iframe src="https://www.youtube.com/embed/${c.videoId}?rel=0" title="${esc(c.name)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>`
        : `<a class="live-fallback" href="${esc(c.url)}" target="_blank" rel="noopener"${c.videoId ? ` style="background-image:url('https://i.ytimg.com/vi/${esc(c.videoId)}/hqdefault.jpg')"` : ""}><span class="pl">▶</span><span class="fb-note">YouTube'da aç</span></a>`;
      return `<div class="live"><div class="live-player">${inner}</div><div class="live-cap"><span class="live-name">${esc(c.name)}</span><span class="live-badge"><span class="d"></span>${esc(c.badge)}</span></div></div>`;
    };
    document.getElementById("livegrid").innerHTML =
      `<div class="live-grp">🟢 Yerel</div>` + list.filter((c) => c.scope === "yerel").map(box).join("") +
      `<div class="live-grp">🌍 Genel</div>` + list.filter((c) => c.scope === "genel").map(box).join("");
  } catch {}
}

// --- Canlı piyasa bandı (/api/markets) ---
async function loadMarkets() {
  try {
    const list = await fetch("/api/markets").then((r) => r.json());
    if (!list || !list.length) return;
    const fmt = (n, d) => n.toLocaleString("tr-TR", { minimumFractionDigits: d, maximumFractionDigits: d });
    const item = (m) => {
      const cls = m.change > 0.001 ? "up" : m.change < -0.001 ? "down" : "";
      const arrow = cls === "up" ? "▲" : cls === "down" ? "▼" : "•";
      const chg = (m.change >= 0 ? "+" : "") + m.change.toFixed(2) + "%";
      return `<span class="tk"><b>${esc(m.label)}</b> <span class="v">${fmt(m.price, m.dec)}${m.unit ? " " + m.unit : ""}</span> <span class="${cls}">${arrow} ${chg}</span></span>`;
    };
    const html = list.map(item).join("");
    document.getElementById("ticker").innerHTML = `<div class="ticker-track">${html}${html}</div>`;
  } catch {}
}

document.getElementById("search").addEventListener("input", (e) => {
  query = e.target.value.trim();
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadFeed, 250);
});

// Yenile butonu: /api/refresh'i tetikler, sonra sayfayı günceller.
document.getElementById("refresh").addEventListener("click", async () => {
  const btn = document.getElementById("refresh");
  const lbl = btn.querySelector(".lbl");
  btn.disabled = true; btn.classList.add("spin"); lbl.textContent = "Yenileniyor…";
  try {
    await fetch("/api/refresh");
    const h = await fetch("/api/health").then((r) => r.json());
    lastGen = h.generatedAt; setFresh(h);
    CATS = await fetch("/api/categories").then((r) => r.json());
    buildNav(); setPressed(); await loadFeed();
  } catch {}
  lbl.textContent = "Yenile"; btn.classList.remove("spin"); btn.disabled = false;
});

// --- Uygulama içi okuyucu (yalnızca Electron'da; tarayıcıda yeni sekme) ---
const IS_ELECTRON = /Electron/i.test(navigator.userAgent);
const nativeOpen = window.open.bind(window);

const reader = (() => {
  const root = document.getElementById("reader");
  const tabsEl = document.getElementById("rd-tabs");
  const viewsEl = document.getElementById("rd-views");
  let tabs = [];          // { id, url, title, tab, view }
  let activeId = null;
  let seq = 0;

  const active = () => tabs.find((t) => t.id === activeId);

  function render() {
    tabsEl.innerHTML = "";
    for (const t of tabs) {
      const el = document.createElement("div");
      el.className = "rd-tab" + (t.id === activeId ? " active" : "") + (t.loading ? " loading" : "");
      el.innerHTML = `<span class="spin"></span><span class="ttl"></span><span class="x" title="Sekmeyi kapat">✕</span>`;
      el.querySelector(".ttl").textContent = t.title || t.url;
      el.title = t.title || t.url;
      el.addEventListener("click", (e) => {
        if (e.target.closest(".x")) { closeTab(t.id); return; }
        activate(t.id);
      });
      tabsEl.appendChild(el);
      t.tab = el;
    }
  }

  function activate(id) {
    activeId = id;
    for (const t of tabs) t.view.classList.toggle("active", t.id === id);
    render();
  }

  function open(url, title) {
    if (!IS_ELECTRON) { nativeOpen(url, "_blank", "noopener"); return; }
    // Aynı URL zaten açıksa ona geç
    const exist = tabs.find((t) => t.url === url);
    if (exist) { root.classList.add("open"); activate(exist.id); return; }

    const id = ++seq;
    const view = document.createElement("webview");
    view.setAttribute("src", url);
    view.setAttribute("allowpopups", "");
    viewsEl.appendChild(view);

    const t = { id, url, title: title || url, view, loading: true };
    tabs.push(t);

    view.addEventListener("page-title-updated", (e) => {
      if (e.title) { t.title = e.title; render(); }
    });
    view.addEventListener("did-start-loading", () => { t.loading = true; render(); });
    view.addEventListener("did-stop-loading", () => {
      t.loading = false;
      try { t.url = view.getURL() || t.url; } catch {}
      render();
    });
    // Sayfa içindeki yeni pencere/sekme istekleri de uygulama içinde açılsın
    view.addEventListener("new-window", (e) => { if (e.url) open(e.url, e.url); });

    root.classList.add("open");
    activate(id);
  }

  function closeTab(id) {
    const i = tabs.findIndex((t) => t.id === id);
    if (i < 0) return;
    tabs[i].view.remove();
    tabs.splice(i, 1);
    if (!tabs.length) { close(); return; }
    if (activeId === id) activate(tabs[Math.max(0, i - 1)].id);
    else render();
  }

  function close() {
    root.classList.remove("open");
    for (const t of tabs) t.view.remove();
    tabs = []; activeId = null;
  }

  document.getElementById("rd-close").addEventListener("click", close);
  document.getElementById("rd-back").addEventListener("click", () => { const t = active(); try { if (t && t.view.canGoBack()) t.view.goBack(); } catch {} });
  document.getElementById("rd-fwd").addEventListener("click", () => { const t = active(); try { if (t && t.view.canGoForward()) t.view.goForward(); } catch {} });
  document.getElementById("rd-reload").addEventListener("click", () => { const t = active(); try { if (t) t.view.reload(); } catch {} });
  document.getElementById("rd-ext").addEventListener("click", () => { const t = active(); if (t) nativeOpen(t.url, "_blank", "noopener"); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && root.classList.contains("open")) close(); });

  return { open };
})();

// Haber kartları / fallback linkleri: Electron'da uygulama içi okuyucuda aç
document.addEventListener("click", (e) => {
  if (!IS_ELECTRON) return;
  const a = e.target.closest('a[href]');
  if (!a) return;
  const href = a.getAttribute("href");
  if (!href || !/^https?:/i.test(href)) return; // # ve iç linkleri atla
  e.preventDefault();
  const title = (a.querySelector(".headline")?.textContent || a.textContent || href).trim();
  reader.open(href, title);
}, true);

// Programatik açılışlar (son dakika pop-up'ı vb.) da okuyucuya gitsin
if (IS_ELECTRON) {
  window.open = (url) => { if (url) reader.open(url, url); return null; };
}

boot();
setInterval(poll, 60000);
setInterval(loadMarkets, 60000);
</script>
